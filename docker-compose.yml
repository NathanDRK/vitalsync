services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vitalsync}
      POSTGRES_USER: ${POSTGRES_USER:-vitalsync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - vitalsync-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    image: ${BACKEND_IMAGE:-vitalsync-backend:local}
    environment:
      PORT: 3000
      DB_HOST: database
      DB_NAME: ${POSTGRES_DB:-vitalsync}
      DB_USER: ${POSTGRES_USER:-vitalsync}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "3000:3000"
    networks:
      - vitalsync-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health | grep -q '\"status\"'"]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
    image: ${FRONTEND_IMAGE:-vitalsync-frontend:local}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    networks:
      - vitalsync-net

networks:
  vitalsync-net:
    driver: bridge

volumes:
  pgdata:

