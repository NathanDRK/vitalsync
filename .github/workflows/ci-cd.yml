name: vitalsync-ci-cd

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ${{ github.repository_owner }}/vitalsync-backend
  IMAGE_FRONTEND: ${{ github.repository_owner }}/vitalsync-frontend

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: vitalsync/backend/package-lock.json

      - name: Install deps (backend)
        working-directory: vitalsync/backend
        run: npm ci || npm install

      - name: Lint (backend)
        working-directory: vitalsync/backend
        run: npm run lint

      - name: Tests (backend)
        working-directory: vitalsync/backend
        run: npm test

  build-push:
    runs-on: ubuntu-latest
    needs: [lint-test]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: vitalsync/backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }}:${{ github.sha }}

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: vitalsync/frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}:${{ github.sha }}

  deploy-staging:
    runs-on: ubuntu-latest
    needs: [build-push]
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Write .env for staging
        working-directory: vitalsync
        run: |
          cat > .env <<'EOF'
          POSTGRES_DB=vitalsync
          POSTGRES_USER=vitalsync
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          BACKEND_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }}:${{ github.sha }}
          FRONTEND_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}:${{ github.sha }}
          EOF

      - name: Pull images
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }}:${{ github.sha }}
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}:${{ github.sha }}

      - name: Deploy (docker compose)
        working-directory: vitalsync
        run: docker compose --env-file .env up -d --remove-orphans

      - name: Health check backend (fail if down)
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/health >/dev/null; then
              echo "Backend healthy"
              exit 0
            fi
            sleep 2
          done
          echo "Backend healthcheck failed"
          docker ps
          docker compose -f vitalsync/docker-compose.yml --env-file vitalsync/.env logs --no-color
          exit 1

