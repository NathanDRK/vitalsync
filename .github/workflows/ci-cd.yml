name: vitalsync-ci-cd

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: vitalsync-backend
  IMAGE_FRONTEND: vitalsync-frontend

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          # Pas de lockfile dans ce projet (package-lock/yarn.lock), donc on désactive le cache npm

      - name: Install deps (backend)
        working-directory: backend
        run: npm ci || npm install

      - name: Lint (backend)
        working-directory: backend
        run: npm run lint

      - name: Tests (backend)
        working-directory: backend
        run: npm test

  build-push:
    runs-on: ubuntu-latest
    needs: [lint-test]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3
      
      - name: Compute GHCR namespace (lowercase)
        id: ns
        run: |
          echo "owner_lc=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.ns.outputs.owner_lc }}/${{ env.IMAGE_BACKEND }}:${{ github.sha }}

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.ns.outputs.owner_lc }}/${{ env.IMAGE_FRONTEND }}:${{ github.sha }}

  deploy-staging:
    runs-on: ubuntu-latest
    needs: [build-push]
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      
      - name: Compute GHCR namespace (lowercase)
        id: ns
        run: |
          echo "owner_lc=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Write .env for staging
        run: |
          DB_PASS="${{ secrets.POSTGRES_PASSWORD }}"
          if [ -z "$DB_PASS" ]; then
            DB_PASS="$(openssl rand -hex 12)"
          fi
          cat > .env <<'EOF'
          POSTGRES_DB=vitalsync
          POSTGRES_USER=vitalsync
          POSTGRES_PASSWORD=__POSTGRES_PASSWORD__
          BACKEND_IMAGE=${{ env.REGISTRY }}/${{ steps.ns.outputs.owner_lc }}/${{ env.IMAGE_BACKEND }}:${{ github.sha }}
          FRONTEND_IMAGE=${{ env.REGISTRY }}/${{ steps.ns.outputs.owner_lc }}/${{ env.IMAGE_FRONTEND }}:${{ github.sha }}
          EOF
          sed -i.bak "s/__POSTGRES_PASSWORD__/${DB_PASS}/g" .env
          rm -f .env.bak

      - name: Pull images
        run: |
          docker pull ${{ env.REGISTRY }}/${{ steps.ns.outputs.owner_lc }}/${{ env.IMAGE_BACKEND }}:${{ github.sha }}
          docker pull ${{ env.REGISTRY }}/${{ steps.ns.outputs.owner_lc }}/${{ env.IMAGE_FRONTEND }}:${{ github.sha }}

      - name: Deploy (docker compose)
        run: docker compose --env-file .env up -d --remove-orphans

      - name: Health check backend (fail if down)
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/health >/dev/null; then
              echo "Backend healthy"
              exit 0
            fi
            sleep 2
          done
          echo "Backend healthcheck failed"
          docker ps
          docker compose -f docker-compose.yml --env-file .env logs --no-color
          exit 1

